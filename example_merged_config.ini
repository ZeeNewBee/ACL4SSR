# 示例：使用合并后的AI服务规则列表
# 原来需要引用多个规则文件：
# ruleset=💬 AI服务, `https://raw.githubusercontent.com/ACL4SSR/ACL4SSR/master/Clash/Ruleset/OpenAi.list`
# ruleset=💬 AI服务, `https://raw.githubusercontent.com/ZeeNewBee/ACL4SSR/refs/heads/master/Clash/Bing.list`
# ruleset=💬 AI服务, `https://raw.githubusercontent.com/ZeeNewBee/ACL4SSR/refs/heads/master/Clash/Ruleset/Claude.list`
# ruleset=💬 AI服务, `https://raw.githubusercontent.com/ZeeNewBee/ACL4SSR/refs/heads/master/Clash/Ruleset/Gemini.list`
# ruleset=💬 AI服务, `https://raw.githubusercontent.com/ZeeNewBee/ACL4SSR/refs/heads/zee/Clash/Ruleset/AIsever.list`

# 现在只需要一条规则引用：
ruleset=💬 AI服务, `https://raw.githubusercontent.com/ZeeNewBee/ACL4SSR/refs/heads/zee/Clash/Ruleset/AIsever.list`

# 或者使用本地文件：
# ruleset=💬 AI服务, ./Clash/Ruleset/AIsever.list

# 合并后的AIsever.list包含了所有AI服务的规则：
# - OpenAI (ChatGPT, GPT API等)
# - Claude (Anthropic)
# - Gemini (Google AI, Bard等)
# - Bing (Microsoft Copilot等)
# - 其他AI服务 (Poe, Perplexity等)

# 总计约70+条规则，已去重并按服务分类整理